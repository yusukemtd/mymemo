[package]
name = "mymemo"
version = "0.1.0"
description = "Lightweight text editor"
edition = "2021"

[lib]
name = "mymemo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
ignore = "0.4"
encoding_rs = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSSavePanel",
    "NSPopUpButton",
    "NSButton",
    "NSControl",
    "NSView",
    "NSResponder",
    "NSTextField",
    "NSWindow",
    "NSPanel",
    "NSApplication",
] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSGeometry"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
